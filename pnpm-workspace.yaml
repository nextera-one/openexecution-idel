packages:
  - "packages/*"

overrides:
  "@nextera.one/tps-standard": "file:./vendor/nextera.one-tps-standard-0.8.1.tgz"

allowBuilds:
  esbuild: true

# Required for `pnpm deploy` to produce a self-contained CLI artifact (workspace
# deps copied in, not symlinked back to source) — verified by `pnpm check:package`.
injectWorkspacePackages: true
forceLegacyDeploy: true

minimumReleaseAgeExclude:
  - electron@42.4.1
