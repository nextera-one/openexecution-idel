name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Spec §31 "Definition of Live": tests must pass on Linux/macOS and
        # Windows. The Windows leg also exercises the PowerShell adapter path
        # (and the one Windows-only test that is skipped elsewhere).
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check static web assets
        run: pnpm check:web

      - name: Check publishable OpenLogs artifact
        run: pnpm check:package

      - name: Dry-run all publishable packages
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm publish:dry-run

      - name: Install and execute npm release tarballs
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm check:npm

      # Boots the real `idel` binary, asserts the thesis demo is BLOCKED, and
      # verifies the signed OpenLogs chain end to end on every supported OS.
      - name: Smoke test (CLI + signed OpenLogs)
        run: pnpm smoke
