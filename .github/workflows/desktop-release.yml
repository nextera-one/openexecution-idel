name: Desktop release candidates
on:
  workflow_dispatch:
  push:
    branches: [release/public-downloads]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-latest
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:web
      - run: pnpm desktop:prepare
      - name: Build standalone candidate
        run: pnpm exec electron-builder --config desktop/electron-builder.cjs --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Configure Linux sandbox for the hosted runner
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root dist/installers/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/installers/linux-unpacked/chrome-sandbox
      - name: Exercise packaged runtime using bundled Electron
        run: node scripts/check-desktop.mjs
      - name: Upload tested candidate (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: idel-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/installers/*.AppImage
            dist/installers/*.deb
            dist/installers/*.dmg
            dist/installers/*.exe
          if-no-files-found: error
